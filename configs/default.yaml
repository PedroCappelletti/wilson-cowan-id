# Configuración por defecto del proyecto.

seed: 42

# Parámetros del modelo de Wilson-Cowan (valores del simulador de MATLAB,
# generan oscilaciones sostenidas / ciclo límite). Estado = [I, E].
model:
  te: 1.0      # constante de tiempo población excitatoria
  ti: 2.0      # constante de tiempo población inhibitoria
  wEE: 6.4     # pesos sinápticos
  wEI: 4.8
  wIE: 6.0
  wII: 1.2
  ae: 1.2      # ganancia sigmoidea excitatoria
  ai: 1.0      # ganancia sigmoidea inhibitoria
  thetae: 2.8  # umbral sigmoidea excitatoria
  thetai: 4.0  # umbral sigmoidea inhibitoria

# Estímulos externos (pulsos cuadrados), como en el simulador de MATLAB.
# P -> población E ; Q -> población I.
stimulus:
  P: { amplitude: 0.8, t_on: 100.0, t_off: 400.0 }
  Q: { amplitude: 0.6, t_on: 200.0, t_off: 500.0 }

# Generación de datos
data:
  t_span: [0.0, 600.0]
  I0: 0.0
  E0: 0.0
  rel_tol: 1.0e-3
  abs_tol: 1.0e-6
  # Grilla uniforme de muestreo (puntos). null = usar los pasos adaptativos.
  n_eval: 6000
  noise_std: 0.0
  out_path: data/processed/dataset.npz

# PINN
pinn:
  in_dim: 1
  out_dim: 2
  hidden_dim: 64
  n_layers: 4

# Entrenamiento
train:
  epochs: 10000
  lr: 0.001
  w_data: 1.0
  w_physics: 1.0
  w_ic: 1.0
  n_collocation: 1000
  device: cpu
  log_every: 100
  checkpoint_dir: results/models
