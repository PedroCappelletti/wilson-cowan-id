# Configuración por defecto del proyecto.

seed: 42

# Parámetros del modelo de Wilson-Cowan
model:
  tau_E: 1.0
  tau_I: 1.0
  c_EE: 16.0
  c_EI: 12.0
  c_IE: 15.0
  c_II: 3.0
  P: 1.0
  Q: 1.0
  a_E: 1.3
  theta_E: 4.0
  a_I: 2.0
  theta_I: 3.7
  r_E: 1.0
  r_I: 1.0

# Generación de datos
data:
  t_span: [0.0, 20.0]
  dt: 0.01
  initial_conditions:
    - [0.1, 0.1]
    - [0.3, 0.2]
  noise_std: 0.0
  out_path: data/processed/dataset.npz

# PINN
pinn:
  in_dim: 1
  out_dim: 2
  hidden_dim: 64
  n_layers: 4

# Entrenamiento
train:
  epochs: 10000
  lr: 0.001
  w_data: 1.0
  w_physics: 1.0
  w_ic: 1.0
  n_collocation: 1000
  device: cpu
  log_every: 100
  checkpoint_dir: results/models
